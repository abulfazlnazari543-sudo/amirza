name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build and Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        run: |
          echo "JAVA_HOME=${JAVA_HOME:-<not set>}"
          if ! command -v java >/dev/null 2>&1; then
            echo "ERROR: java command not found; Java environment could not be detected."
            exit 1
          fi
          java -version
          JAVA_VERSION_RAW=$(java -version 2>&1 | head -n 1 | sed -n 's/.*version "\([^"]*\)".*/\1/p')
          if [ -z "$JAVA_VERSION_RAW" ]; then
            echo "ERROR: Unable to parse active Java version."
            exit 1
          fi
          JAVA_MAJOR=$(echo "$JAVA_VERSION_RAW" | cut -d. -f1)
          if [ "$JAVA_MAJOR" = "1" ]; then
            JAVA_MAJOR=$(echo "$JAVA_VERSION_RAW" | cut -d. -f2)
          fi
          if ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Unable to detect numeric Java major version from '$JAVA_VERSION_RAW'."
            exit 1
          fi
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Java 17 or newer is required, but detected Java $JAVA_MAJOR."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            KEYTOOL_BIN="keytool"
            if [ -n "${JAVA_HOME:-}" ] && [ -x "${JAVA_HOME}/bin/keytool" ]; then
              KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            fi
            "$KEYTOOL_BIN" -genkeypair \
              -keystore "./debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1 || {
                echo "ERROR: Failed to generate temporary debug keystore."
                exit 1
              }
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Temporary debug keystore ./debug.keystore does not exist."
            exit 1
          fi
          echo "Temporary debug keystore is ready."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        id: verify_apk
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$APK_PATH" ] || [ ! -f "$APK_PATH" ] || [ ! -s "$APK_PATH" ] || [[ "$APK_PATH" != *.apk ]]; then
            echo "ERROR: Expected debug APK not found or invalid at $APK_PATH"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          echo "Verified debug APK: $APK_PATH ($(wc -c < "$APK_PATH") bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          ASSET_DIR=$(mktemp -d "${RUNNER_TEMP}/apk-release-XXXXXX")
          ASSET_PATH="${ASSET_DIR}/app-debug.apk"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"
          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $(basename "$ASSET_PATH")"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            echo "ERROR: GitHub CLI (gh) is not available."
            exit 1
          fi
          gh --version

          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "ERROR: Prepared APK release asset is missing, empty, or invalid."
            exit 1
          fi

          if [ "$(basename "$ASSET_PATH")" != "app-debug.apk" ]; then
            echo "ERROR: Release asset filename must be exactly app-debug.apk."
            exit 1
          fi

          TAG_NAME="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_NOTES=$(cat <<EOF
          This is an automatically generated debug APK built by GitHub Actions.

          - GitHub Actions Run Number: ${GITHUB_RUN_NUMBER}
          - GitHub Actions Run Attempt: ${GITHUB_RUN_ATTEMPT}
          - Source Commit SHA: ${GITHUB_SHA}
          - Purpose: Intended for testing only; this APK is NOT a Play Store production release.
          - Signing: Signed only with a temporary debug keystore.
          EOF
          )

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_apk.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.upload_artifact.outcome }}
          TAG_NAME: ${{ steps.publish_release.outputs.tag_name }}
          RELEASE_TITLE: ${{ steps.publish_release.outputs.release_title }}
        run: |
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            if [ -z "$TAG_NAME" ]; then
              TAG_NAME="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
            fi
            if [ -z "$RELEASE_TITLE" ]; then
              RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
            fi
            RELEASE_URL=$(gh release view "$TAG_NAME" --json url --jq '.url')
            DIRECT_APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

            echo "Release Tag: ${TAG_NAME}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release Page URL: ${RELEASE_URL}"
            echo "APK Filename: app-debug.apk"
            echo "DIRECT APK DOWNLOAD: ${DIRECT_APK_URL}"
            echo "Backup GitHub Actions artifact 'app-debug-apk' remains available."

            {
              echo "## DIRECT APK DOWNLOAD"
              echo ""
              echo "${DIRECT_APK_URL}"
              echo ""
              echo "- **Release Tag:** ${TAG_NAME}"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Page:** ${RELEASE_URL}"
              echo "- **APK Filename:** app-debug.apk"
              echo "- **Backup:** Normal Actions artifact \`app-debug-apk\` remains available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed."
            if [ "$VERIFY_OUTCOME" = "success" ]; then
              echo "The debug APK build succeeded (app/build/outputs/apk/debug/app-debug.apk)."
            else
              echo "The debug APK build did not succeed."
            fi
            if [ "$ARTIFACT_OUTCOME" = "success" ]; then
              echo "The normal Actions artifact named 'app-debug-apk' remains available."
            fi

            {
              echo "## GitHub Release Publishing Failed"
              echo ""
              if [ "$VERIFY_OUTCOME" = "success" ]; then
                echo "- **APK Build:** Succeeded"
              else
                echo "- **APK Build:** Failed"
              fi
              if [ "$ARTIFACT_OUTCOME" = "success" ]; then
                echo "- **Backup Artifact:** Actions artifact \`app-debug-apk\` remains available."
              fi
              echo "- Note: The new APK was not published to the latest GitHub Release."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
